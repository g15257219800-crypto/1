<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" role="img" aria-label="FreeCAD modeling workflow">
  <rect class="box" x="10" y="28" width="150" height="88" rx="10" fill="#1f6feb"/>
  <text fill="#fff" font="600 15px sans-serif" x="85" y="68" text-anchor="middle">1. New file</text>
  <text fill="#fff" font="12px sans-serif" x="85" y="92" text-anchor="middle" opacity=".9">Ctrl+N  .FCStd</text>
  <polygon fill="#57606a" points="168,72 188,62 188,82"/>
  <rect x="196" y="28" width="150" height="88" rx="10" fill="#1f6feb"/>
  <text fill="#fff" font="600 15px sans-serif" x="271" y="68" text-anchor="middle">2. Part Design</text>
  <text fill="#fff" font="12px sans-serif" x="271" y="92" text-anchor="middle" opacity=".9">Body + Sketch</text>
  <polygon fill="#57606a" points="354,72 374,62 374,82"/>
  <rect x="382" y="28" width="150" height="88" rx="10" fill="#1f6feb"/>
  <text fill="#fff" font="600 15px sans-serif" x="457" y="68" text-anchor="middle">3. Constrain</text>
  <text fill="#fff" font="12px sans-serif" x="457" y="92" text-anchor="middle" opacity=".9">sketch turns green</text>
  <polygon fill="#57606a" points="540,72 560,62 560,82"/>
  <rect x="568" y="28" width="150" height="88" rx="10" fill="#1f6feb"/>
  <text fill="#fff" font="600 15px sans-serif" x="643" y="68" text-anchor="middle">4. Features</text>
  <text fill="#fff" font="12px sans-serif" x="643" y="92" text-anchor="middle" opacity=".9">Pad / Pocket / Fillet</text>
  <polygon fill="#57606a" points="726,72 746,62 746,82"/>
  <rect x="754" y="28" width="150" height="88" rx="10" fill="#0969da"/>
  <text fill="#fff" font="600 15px sans-serif" x="829" y="68" text-anchor="middle">5. Export</text>
  <text fill="#fff" font="12px sans-serif" x="829" y="92" text-anchor="middle" opacity=".9">STEP / STL / PDF</text>
</svg>
